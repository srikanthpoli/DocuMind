<div class="app-shell">
  <header class="topbar">
    <a class="brand" href="/" aria-label="DocuMind home">
      <span class="brand-mark">D</span>
      <span>DocuMind</span>
    </a>
    <div class="connection-state"><span class="status-dot"></span> Local workspace</div>
  </header>

  <main class="workspace">
    <section class="intro">
      <p class="eyebrow">Private document intelligence</p>
      <h1>Ask your documents<br><em>better questions.</em></h1>
      <p class="intro-copy">Bring in a PDF, then explore its ideas through a conversation grounded in the source.</p>
    </section>

    <section class="workspace-grid">
      <aside class="document-panel">
        <app-upload></app-upload>
      </aside>

      <section class="chat-panel">
        <app-chatbot
          [sessionId]="sessionId"
          (newSessionRequested)="startNewSession()"
        ></app-chatbot>
      </section>
    </section>
  </main>

  <footer class="footer">
    <span>DOCUMIND / LOCAL RAG WORKSPACE</span>
    <span>SESSION {{ sessionId.slice(0, 8) }}</span>
  </footer>
</div>
